name: CI

on:
  push:
  pull_request:
  release:
    types:
      - created
  workflow_dispatch:
    
jobs:
  build-matlab-toolbox:
    runs-on: windows-latest
    steps:    
    - name: Checkout repository
      uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        repository: johnwason/robotraconteur
        run-id: 15436745068
        path: artifacts/main
        github-token: ${{ secrets.TOKEN }}
        pattern: "out-matlab*"
    - uses: actions/download-artifact@v4
      with:
        repository: johnwason/robotraconteur
        run-id: 15436745068
        path: artifacts/main
        github-token: ${{ secrets.TOKEN }}
        pattern: out-win-x64
       
    