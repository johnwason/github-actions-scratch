name: CI

on:
  push:
  pull_request:
  release:
    types:
      - created
  workflow_dispatch:
    
jobs:
  test-setup-python:
    runs-on: ${{ matrix.config.runs_on }}
    container: ${{ matrix.config.container }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - os: ubuntu-20.04
          runs_on: ubuntu-latest
          container: "ubuntu:focal"
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: ubuntu-22.04
          runs_on: ubuntu-22.04
          container: ""
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: ubuntu-24.04
          runs_on: ubuntu-22.04
          container: ""
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: debian-10
          runs_on: ubuntu-latest
          container: debian:buster-slim
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: debian-11
          runs_on: ubuntu-latest
          container: debian:bullseye-slim
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: ubuntu-20.04-arm
          runs_on: ubuntu-24.04-arm
          container: "ubuntu:focal"
          arch: aarch64
          wheel_platform: manylinux_2_31_aarch64
        - os: ubuntu-22.04-arm
          runs_on: ubuntu-22.04-arm
          container: ""
          arch: aarch64
          wheel_platform: manylinux_2_31_aarch64
        # - os: windows-latest
        #   run_ons: windows-latest
        #   container: ""
        #   arch: x64
    steps:
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.8
      if: always()
      with:
        default: "3.8"
        # print version
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.9
      if: always()
      with:
        default: "3.9"
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.10
      if: always()
      with:
        default: "3.10"
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.11
      if: always()
      with:
        default: "3.11"
        command: "python --version"
    - name: test python version
      if: always()
      run: |
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.12
      if: always()
      with:
        default: "3.12"
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.13
      if: always()
      with:
        default: "3.13"
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"

    
    