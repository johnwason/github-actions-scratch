name: CI

on:
  push:
  pull_request:
  release:
    types:
      - created
  workflow_dispatch:
    
jobs:
  build-matlab-toolbox:
    runs-on: ubuntu-22.04
    steps: 
    - name: apt
      run: |
        sudo apt-get update
        sudo apt-get install -y tree
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: robotraconteur
    - uses: actions/download-artifact@v4
      with:
        repository: johnwason/robotraconteur
        run-id: 15436745068
        path: artifacts/main
        github-token: ${{ secrets.TOKEN }}
        pattern: "out-matlab*"
    - uses: actions/download-artifact@v4
      with:
        repository: johnwason/robotraconteur
        run-id: 15436745068
        path: artifacts/main
        github-token: ${{ secrets.TOKEN }}
        pattern: out-win-x64
    - name: install matlab
      id: setup-matlab
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2022b
    - name: prepare matlab toolbox
      run: python3 robotraconteur/packaging/scripts/build_matlab_toolbox2.py
    - name: build matlab toolbox
      uses: matlab-actions/run-command@v2
      with:
        command: cd('${{github.workspace}}/build-matlab-toolbox/build'); matlab.addons.toolbox.packageToolbox('RobotRaconteurMatlab.prj','RobotRaconteurMatlab');
    - name: move matlab toolbox
      run: |
        mv build-matlab-toolbox/build/*.mltbx ${{github.workspace}}
    - name: upload matlab toolbox
      uses: actions/upload-artifact@v4
      with:
        name: matlab-toolbox
        path: "*.mltbx"
    - name: tree
      if: always()
      run: |
        tree
    - name: upload all files
      uses: actions/upload-artifact@v4
      with:
        name: debug-files
        path: "**/*"
       
    