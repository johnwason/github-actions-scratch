name: CI

on:
  push:
  pull_request:
  release:
    types:
      - created
  workflow_dispatch:
    
jobs:
  test-setup-python:
    runs-on: ${{ matrix.config.runs_on }}
    container: ${{ matrix.config.container }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - os: ubuntu-20.04
          runs_on: ubuntu-latest
          container: "ubuntu:focal"
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: ubuntu-22.04
          runs_on: ubuntu-22.04
          container: ""
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: ubuntu-24.04
          runs_on: ubuntu-22.04
          container: ""
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: debian-10
          runs_on: ubuntu-latest
          container: debian:buster-slim
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: debian-11
          runs_on: ubuntu-latest
          container: debian:bullseye-slim
          arch: x64
          wheel_platform: manylinux_2_31_x86_64
        - os: ubuntu-20.04-arm
          runs_on: ubuntu-24.04-arm
          container: "ubuntu:focal"
          arch: aarch64
          wheel_platform: manylinux_2_31_aarch64
        - os: ubuntu-22.04-arm
          runs_on: ubuntu-22.04-arm
          container: ""
          arch: aarch64
          wheel_platform: manylinux_2_31_aarch64
        # - os: windows-latest
        #   run_ons: windows-latest
        #   container: ""
        #   arch: x64
    steps:
    - name: Switch to Azure Ubuntu mirror
      if: ${{ matrix.config.container != '' && startsWith(matrix.config.container, 'ubuntu:') }}
      run: |
        sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
        sed -i 's|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
    - name: install sudo for containers
      if: ${{ matrix.config.container != '' }}
      run: |
        apt-get update
        apt install sudo tzdata -y
        ln -fs /usr/share/zoneinfo/Etc/UTC /etc/localtime
        dpkg-reconfigure --frontend noninteractive tzdata
        apt-get install -y sudo
    - name: apt
      if: always()
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          zlib1g zlib1g-dev libssl-dev libusb-1.0-0 wget \
          libusb-1.0-0-dev libdbus-1-3 libdbus-1-dev libbluetooth3 libbluetooth-dev zlib1g zlib1g-dev \
          git cmake g++ make libboost-all-dev autoconf ninja-build libsqlite3-dev libreadline-dev \
          automake libtool bison libpcre3-dev curl libgtest-dev python3-minimal libffi-dev liblzma-dev unzip
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.8
      if: always()
      with:
        default: "3.8"
        versions: "3.8 "
        # print version
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        eval "$(pyenv init -)"
        pyenv global 3.8
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.9
      if: always()
      with:
        default: "3.9"
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        eval "$(pyenv init -)"
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.10
      if: always()
      with:
        default: "3.10"
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        eval "$(pyenv init -)"
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.11
      if: always()
      with:
        default: "3.11"
        command: "python --version"
    - name: test python version
      if: always()
      run: |
        eval "$(pyenv init -)"
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.12
      if: always()
      with:
        default: "3.12"
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        eval "$(pyenv init -)"
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"
    - uses: "gabrielfalcao/pyenv-action@v18"
      name: python 3.13
      if: always()
      with:
        default: "3.13"
        command: "python --version"
        
    - name: test python version
      if: always()
      run: |
        eval "$(pyenv init -)"
        python --version
        python -c "import sys; print(sys.executable)"
        python -c "import sys; print(sys.version_info)"

    
    