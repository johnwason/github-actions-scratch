schema_version: 1

package:
  name: tesseract-robotics-python
  version: "0.35.0a1"

source:
  - url: https://github.com/johnwason/tesseract_python-1/archive/2627c4a1c36c3ee636b2248098bbeb5520fee7ca.tar.gz
    sha256: d3062e8aab4b27a61f468851c77435e4b654390209f12fb49ec3233c7e927d81
    file_name: source.tar.gz

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - gtest
    - gmock
    - cmake
    - ninja
    - ros-industrial-cmake-boilerplate
    - if: linux
      then: lcov
    - if: linux
      then: ${{ cdt('mesa-libgl-devel') }}
    - if: linux
      then: ${{ cdt('mesa-dri-drivers') }}
    - pkg-config
    - swig
  host:
    - eigen
    - console_bridge
    - libboost-devel
    - python
    - numpy
    - setuptools
    - pip
    - tesseract-robotics
    - tesseract-robotics-planning
  run:
    - python
    - numpy
    - setuptools
    - aiohttp
    - importlib-resources
    - opencv

tests:
  - python:
      imports:
        - tesseract_robotics.tesseract_task_composer
        - tesseract_robotics_viewer
      pip_check: false

about:
  summary: Python bindings for Tesseract planning framework
  license: Apache-2.0
  license_file:  
  - src/LICENSE.Apache-2.0
  homepage: https://github.com/tesseract-robotics/tesseract_python

extra:
  recipe-maintainers:
    - johnwason
    - Levi-Armstrong
    - traversaro

