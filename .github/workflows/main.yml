name: CI

on:
  push:
  pull_request:
  release:
    types:
      - created
  workflow_dispatch:
    
jobs:
  build-matlab-toolbox:
    runs-on: windows-latest
    steps:    
    - name: Checkout repository
      uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        repository: johnwason/robotraconteur
        run-id: 2068
        path: artifacts/main
        artifact-ids: |
          out-matlab
          out-matlab-osx-arm64
          out-matlab-osx-x64
          out-win-x64

        
    