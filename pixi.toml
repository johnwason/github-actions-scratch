# RoboStack (ROS 2 Jazzy on conda-forge) environment for the cross-platform CI
# on GitHub-hosted runners (see CLAUDE.md S6). scripts/push-ci.sh places this
# file at the root of the CI snapshot, with the sources under src/.
# Not used for local builds: those run in podman (scripts/build.sh).

[workspace]
name = "rmw_intraprocess_ci"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
cmake = "*"
ninja = "*"
pkg-config = "*"
colcon-common-extensions = "*"
ros-jazzy-ament-cmake = "*"
ros-jazzy-ament-cmake-gtest = "*"
ros-jazzy-ament-lint-auto = "*"
ros-jazzy-ament-lint-common = "*"
ros-jazzy-rclcpp = "*"
ros-jazzy-rcpputils = "*"
ros-jazzy-rmw = "*"
ros-jazzy-rmw-fastrtps-cpp = "*"
ros-jazzy-rmw-implementation = "*"
ros-jazzy-rosidl-typesupport-fastrtps-c = "*"
ros-jazzy-rosidl-typesupport-fastrtps-cpp = "*"
ros-jazzy-rosidl-typesupport-introspection-c = "*"
ros-jazzy-rosidl-typesupport-introspection-cpp = "*"
ros-jazzy-test-msgs = "*"
ros-jazzy-ament-index-cpp = "*"
ros-jazzy-class-loader = "*"
ros-jazzy-rclcpp-components = "*"
ros-jazzy-rosbag2-cpp = "*"
ros-jazzy-rosbag2-storage-mcap = "*"
ros-jazzy-rosbag2-transport = "*"
# M8: actions, lifecycle and the standard demo components.
ros-jazzy-rclcpp-action = "*"
ros-jazzy-rclcpp-lifecycle = "*"
ros-jazzy-composition = "*"
ros-jazzy-composition-interfaces = "*"
ros-jazzy-demo-nodes-cpp = "*"
ros-jazzy-action-tutorials-cpp = "*"
ros-jazzy-action-tutorials-interfaces = "*"
ros-jazzy-example-interfaces = "*"
ros-jazzy-lifecycle-msgs = "*"
ros-jazzy-std-msgs = "*"
# M8c: rmw_intraprocess_torture generates its own interfaces.
ros-jazzy-rosidl-default-generators = "*"
ros-jazzy-rosidl-default-runtime = "*"
# Same uncrustify as the ROS Jazzy apt packages (uncrustify_vendor) used by the
# local podman gate: newer versions format lambdas and macros differently.
uncrustify = "0.78.1.*"

[target.win-64.dependencies]
vs2022_win-64 = "*"

[target.linux-64.dependencies]
compilers = "*"

[tasks]
# CI_BUILD_BASE / CI_INSTALL_BASE are set by the workflow: short absolute
# directories on Windows (the generated rosidl Python-extension object paths
# exceed MAX_PATH under the long runner checkout path), build/install elsewhere.
build = "colcon build --base-paths src --build-base $CI_BUILD_BASE --install-base $CI_INSTALL_BASE --event-handlers console_direct+ --cmake-args -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON"
test = "colcon test --base-paths src --build-base $CI_BUILD_BASE --install-base $CI_INSTALL_BASE --event-handlers console_direct+ --return-code-on-test-failure --ctest-args --output-on-failure"
test-result = "colcon test-result --test-result-base $CI_BUILD_BASE --all --verbose"
